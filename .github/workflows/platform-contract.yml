name: Harness native core contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: harness-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check canonical checkout bytes
        run: node tests/harness/native-checkout-contract-check.mjs
      - name: Check offline backend contracts
        run: node tests/harness/ledger-contract-check.mjs
      - name: Check board and ledger policies
        run: node tests/harness/consumer-policy-check.mjs
      - name: Check hook policy regressions
        run: node tests/harness/native-hook-contract-check.mjs
      - name: Check native guardrail wiring and negative controls
        run: node plugins/harness/checks/guardrail-check.mjs
      - name: Run generic delegation and capability integration contracts
        run: node tests/harness/delegation-contract-check.mjs
      - name: Run delegation procedure and doctor integration contracts
        run: node tests/harness/delegation-integration-check.mjs
      - name: Run registered generic child hook contracts
        run: node tests/harness/generic-hook-check.mjs
      - name: Run Codex identity transport and model contracts
        run: node tests/harness/codex-identity-check.mjs
  native:
    strategy:
      fail-fast: false
      matrix:
        host:
          - {runner: macos-latest, platform: darwin}
          - {runner: ubuntu-latest, platform: linux}
          - {runner: windows-latest, platform: win32}
    runs-on: ${{ matrix.host.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # pwsh is the native Windows runner shell; the test spawns no shell.
      - name: Run identical Node/Git core suite (not full product certification)
        run: node tests/harness/platform-contract-check.mjs ${{ matrix.host.platform }} platform-contract.json
      - name: Run native process and configured preparation contracts
        if: ${{ !cancelled() }}
        run: node tests/harness/native-preparation-contract-check.mjs ${{ matrix.host.platform }}
      - name: Check native ledger CLI, paths and stdio
        if: ${{ !cancelled() }}
        run: node tests/harness/native-ledger-contract-check.mjs ${{ matrix.host.platform }}
      - name: Check native board files, locks and worktrees
        if: ${{ !cancelled() }}
        run: node tests/harness/native-consumers-contract-check.mjs ${{ matrix.host.platform }}
      - name: Run native guard filesystem contracts
        if: ${{ !cancelled() }}
        run: node tests/harness/native-guard-path-check.mjs ${{ matrix.host.platform }}
      - name: Run runtime hook transport contracts
        if: ${{ !cancelled() }}
        run: node tests/harness/native-hook-transport-check.mjs ${{ matrix.host.platform }}
      - name: Preserve reached scope even when a contract fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.host.platform }}-node-24
          path: |
            platform-contract.json
          if-no-files-found: error
          retention-days: 14
